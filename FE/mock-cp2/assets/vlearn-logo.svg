  <text x="68" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#DC2626" letter-spacing="-0.5">V</text>
  <!-- Navy 'Learn' -->
  <text x="85" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0A3678" letter-spacing="-0.5">Learn</text>
</svg>

